<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
<div class="calculator" role="application" aria-label="Calculator">
<div class="screen" aria-live="polite">
<div class="history" id="history">&nbsp;</div>
<div class="output" id="output">0</div>
</div>


<div class="keys" id="keys">
<button id="clear" class="action">AC</button>
<button id="back" title="Backspace">⌫</button>
<button id="percent" class="op">%</button>
<button data-op="/" class="op">÷</button>


<button data-num="7">7</button>
<button data-num="8">8</button>
<button data-num="9">9</button>
<button data-op="*" class="op">×</button>


<button data-num="4">4</button>
<button data-num="5">5</button>
<button data-num="6">6</button>
<button data-op="-" class="op">−</button>


<button data-num="1">1</button>
<button data-num="2">2</button>
<button data-num="3">3</button>
<button data-op="+" class="op">+</button>


<button data-num="0" class="wide">0</button>
<button id="dot">.</button>
<button id="equals" class="action">=</button>
</div>


<div class="kbd-hint">You can also use your keyboard — numbers, + - * / Enter = Backspace Esc</div>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
